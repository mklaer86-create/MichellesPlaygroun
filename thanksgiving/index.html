<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanksgiving Table Talk</title>
<meta name="description" content="Family-friendly icebreaker questions for the Thanksgiving table.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦃</text></svg>">
<style>
  :root {
    --bg: #fbf6ef; --card: #ffffff; --ink: #3b2a1f; --muted: #7a6656;
    --accent: #c2571a; --accent-ink: #fff; --chip: #f1e4d3; --chip-on: #8a3b12; --line: #e7d8c5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1813; --card: #2b221b; --ink: #f4e9dc; --muted: #bfa892;
      --accent: #e0752f; --accent-ink: #1f1813; --chip: #3a2e25; --chip-on: #e0752f; --line: #43362b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; }
  header { text-align: center; max-width: 640px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 1.05rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 680px; margin-bottom: 20px; }
  .chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: .95rem; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: #fff; border-color: var(--chip-on); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; width: 100%; max-width: 640px;
    min-height: 260px; padding: 32px 28px; display: flex; flex-direction: column; justify-content: center;
    box-shadow: 0 10px 30px rgba(80, 40, 10, .08); text-align: center; }
  .cat { text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; color: var(--accent); margin-bottom: 14px;
    font-family: system-ui, sans-serif; font-weight: 600; }
  .q { font-size: clamp(1.4rem, 4.2vw, 2rem); line-height: 1.35; margin: 0; }
  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 14px;
    padding: 14px 28px; font: inherit; font-size: 1.15rem; cursor: pointer; font-weight: bold; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; font: inherit; font-size: 1rem; cursor: pointer; }
  button:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .meta { color: var(--muted); font-size: .9rem; margin-top: 14px; font-family: system-ui, sans-serif; }
  footer { margin-top: auto; padding-top: 32px; color: var(--muted); font-size: .85rem; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>🦃 Thanksgiving Table Talk</h1>
  <p class="sub">Clean, family-friendly questions to get to know each other's families. Pass the phone, read it out loud, everyone answers!</p>
</header>

<div class="chips" id="chips" role="group" aria-label="Question categories"></div>

<main class="card" aria-live="polite">
  <div class="cat" id="cat">Ready when you are</div>
  <p class="q" id="q">Tap “Next question” to start the conversation.</p>
</main>

<div class="actions">
  <button class="ghost" id="back" aria-label="Previous question">← Back</button>
  <button class="primary" id="next">Next question</button>
  <button class="ghost" id="copy">Copy</button>
</div>
<div class="meta" id="meta"></div>

<footer>Tip: press the space bar or tap the card for the next question.</footer>

<script>
const QUESTIONS = {
  "Family Stories": [
    "What's a story your family tells every year at holidays?",
    "Who in your family is the best storyteller, and what's their best story?",
    "What's the funniest thing that ever happened at a family gathering?",
    "What did your grandparents do for fun when they were kids?",
    "Is there a family recipe with a story behind it?",
    "What's something your parents did growing up that would surprise us?",
    "How did your parents or grandparents meet?",
    "What's a family tradition you'd like to start?",
    "What's the best road trip your family ever took?",
    "What's one thing your family is known for?",
    "Who taught you something important, and what was it?",
    "What's a family nickname and how did it start?"
  ],
  "Gratitude": [
    "What's one small thing that made you smile this year?",
    "Who is someone at this table you're thankful for, and why?",
    "What's something you have now that you once wished for?",
    "What's a kindness someone showed you that you still remember?",
    "What's a simple everyday thing you're grateful for?",
    "What's one thing you learned this year that you're glad you know?",
    "Which friend has made the biggest difference in your life?",
    "What's a place you're thankful you got to visit?",
    "What's a challenge this year that turned out to be a good thing?",
    "If you could thank one person from your past, who would it be?"
  ],
  "Food & Traditions": [
    "What's your must-have Thanksgiving dish?",
    "Stuffing or mashed potatoes — you can only pick one!",
    "What's the most unusual food your family eats on holidays?",
    "If you could add one new dish to Thanksgiving, what would it be?",
    "What was your favorite meal growing up?",
    "Pumpkin pie, apple pie, or pecan pie?",
    "Who is the best cook in your family, and what's their specialty?",
    "What's a holiday tradition from your family that others might find surprising?",
    "What's your favorite holiday smell?",
    "What's the best leftover creation you've ever made?",
    "Which holiday decoration or tradition makes it feel official?"
  ],
  "Would You Rather": [
    "Would you rather have Thanksgiving dinner on a beach or in a snowy cabin?",
    "Would you rather only eat side dishes or only eat dessert at Thanksgiving?",
    "Would you rather be able to talk to animals or speak every language?",
    "Would you rather live in the time of your grandparents or 50 years in the future?",
    "Would you rather have a pet dragon or a pet unicorn?",
    "Would you rather be a famous chef or a famous musician?",
    "Would you rather explore space or the bottom of the ocean?",
    "Would you rather always be 10 minutes early or 10 minutes late?",
    "Would you rather have a house in the trees or underground?",
    "Would you rather give up your phone for a month or dessert for a year?"
  ],
  "Just for Fun": [
    "If you could have dinner with anyone, past or present, who would it be?",
    "What's a talent you have that most people don't know about?",
    "If your family were a TV show, what would it be called?",
    "What would you do with a whole day off and no plans?",
    "What's a song that always gets you dancing?",
    "If you could instantly master any skill, what would it be?",
    "What's the best movie you've seen this year?",
    "If you could live anywhere in the world for a year, where?",
    "What's your favorite way to spend a Sunday?",
    "What's a hobby you'd love to try?",
    "If you won a free vacation tomorrow, where would you go?",
    "What's the best gift you've ever given someone?"
  ],
  "Kids' Corner": [
    "If you were a Thanksgiving food, what would you be?",
    "What superpower would you want and why?",
    "What's the silliest joke you know?",
    "If you could invent a new holiday, what would it celebrate?",
    "What animal would you be for a day?",
    "What's your favorite thing to do with your family?",
    "If you could make one rule for the whole world, what would it be?",
    "What do you want to be when you grow up?",
    "If a turkey could talk, what would it say?",
    "What's the best thing about being a kid?",
    "If your toys came to life, which one would you hang out with?"
  ],
  "Getting to Know You": [
    "Where did you grow up, and what was your neighborhood like?",
    "What was your very first job?",
    "What's something on your bucket list?",
    "What's the best advice you've ever received?",
    "What's a book or show you'd recommend to everyone here?",
    "What are you most looking forward to next year?",
    "What's something that always makes you laugh?",
    "What's a goal you're working toward right now?",
    "What three words would your friends use to describe you?",
    "What's your favorite season and why?"
  ]
};

const cats = Object.keys(QUESTIONS);
let active = new Set(cats);
let deck = [], history = [], pos = -1;

const $ = id => document.getElementById(id);
const chips = $("chips");

function renderChips() {
  chips.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip"; all.textContent = "All";
  all.setAttribute("aria-pressed", active.size === cats.length);
  all.onclick = () => { active = new Set(cats); rebuild(); };
  chips.appendChild(all);
  for (const c of cats) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = c;
    b.setAttribute("aria-pressed", active.size !== cats.length && active.has(c));
    b.onclick = () => {
      if (active.size === cats.length) active = new Set([c]);
      else if (active.has(c)) { active.delete(c); if (!active.size) active = new Set(cats); }
      else active.add(c);
      rebuild();
    };
    chips.appendChild(b);
  }
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function rebuild() {
  const seen = new Set(history.map(h => h.q));
  deck = shuffle(cats.filter(c => active.has(c)).flatMap(c => QUESTIONS[c].map(q => ({ c, q }))).filter(x => !seen.has(x.q)));
  renderChips(); updateMeta();
}

function show(item) {
  const qEl = $("q"), cEl = $("cat");
  qEl.classList.remove("fade"); void qEl.offsetWidth; qEl.classList.add("fade");
  cEl.textContent = item.c; qEl.textContent = item.q; updateMeta();
}

function next() {
  if (pos < history.length - 1) { pos++; return show(history[pos]); }
  if (!deck.length) {
    history = history.filter(h => !active.has(h.c)).concat([]); pos = history.length - 1;
    rebuild();
    $("cat").textContent = "You've seen them all! 🎉"; $("q").textContent = "Shuffling a fresh round — tap next to keep going.";
    return;
  }
  const item = deck.pop(); history.push(item); pos = history.length - 1; show(item);
}
function back() { if (pos > 0) { pos--; show(history[pos]); } }

function updateMeta() {
  const total = cats.filter(c => active.has(c)).reduce((n, c) => n + QUESTIONS[c].length, 0);
  $("meta").textContent = `${deck.length} of ${total} questions left in this round`;
}

$("next").onclick = next; $("back").onclick = back;
document.querySelector(".card").onclick = next;
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("q").textContent); $("copy").textContent = "Copied!"; }
  catch { $("copy").textContent = "Can't copy"; }
  setTimeout(() => $("copy").textContent = "Copy", 1200);
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON") return;
  if (e.code === "Space" || e.key === "ArrowRight") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft") back();
});

rebuild();
</script>
</body>
</html>
